<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrhorkosWebSites | Bienvenida</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
            --primary: #7b2ffd;
            --primary-hover: #9353ff;
            --text-main: #f8f9fa;
            --text-muted: #a0a5b1;
            --border-color: #2a2c3d;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .welcome-container {
            text-align: center;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .welcome-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .welcome-title span {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(123, 47, 253, 0.6);
        }
        .welcome-subtitle {
            font-size: 1.3rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .btn-solicitar {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 18px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(123, 47, 253, 0.4);
        }
        .btn-solicitar:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(123, 47, 253, 0.7);
        }
        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-main);
            font-size: 1.3rem;
            text-decoration: none;
            transition: var(--transition);
        }
        .social-icon:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(123, 47, 253, 0.5);
        }
        .comentarios {
            max-width: 600px;
            margin: 60px auto 40px;
            padding: 0 20px;
            text-align: center;
        }
        .comentarios h3 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--primary);
        }
        #formComentario {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        #formComentario input,
        #formComentario textarea {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 1rem;
        }
        #formComentario textarea {
            resize: none;
        }
        #formComentario button {
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            transition: transform 0.3s;
        }
        #formComentario button:hover {
            transform: translateY(-3px);
        }
        .comentario-item {
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0;
            text-align: left;
        }
        .comentario-item strong {
            color: var(--primary);
            font-size: 1.05rem;
        }
        .comentario-item p {
            margin: 8px 0;
            color: var(--text-main);
            line-height: 1.5;
        }
        .comentario-item small {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1 class="welcome-title">Krhorkos<span>WebSites</span></h1>
        <p class="welcome-subtitle">Tu presencia en internet, construida a tu medida</p>
        
        <a href="sitios.html" class="btn-solicitar">🛒 Solicitar mi sitio web</a>
        
        <div class="social-links">
            <a href="https://www.instagram.com/krhorkos3dstudioand2d/" target="_blank" class="social-icon" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://x.com/krhorkos3DAnd2D" target="_blank" class="social-icon" title="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a href="https://www.youtube.com/@Krhorkos3DStudioAnd2D-b6g" target="_blank" class="social-icon" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://alex293517.itch.io/" target="_blank" class="social-icon" title="Itch.io">
                <i class="fa-brands fa-itch-io"></i>
            </a>
        </div>
    </div>

    <!-- SECCIÓN DE COMENTARIOS -->
    <div class="comentarios">
        <h3>💬 Déjanos tu comentario</h3>
        
        <form id="formComentario">
            <input type="text" id="nombre" placeholder="Tu nombre" required>
            <textarea id="mensaje" placeholder="Tu comentario..." required rows="4"></textarea>
            <button type="submit">Enviar comentario ✅</button>
        </form>

        <div id="listaComentarios"></div>
    </div>

    <script>
        const API_URL = "https://krhorkoswebsites.krhorkos3dstudioand2d.workers.dev/api/comments";

        async function cargarComentarios() {
            try {
                const res = await fetch(API_URL);
                const comentarios = await res.json();
                const lista = document.getElementById('listaComentarios');
                lista.innerHTML = '';
                
                if (comentarios.length === 0) {
                    lista.innerHTML = '<p style="color: #a0a5b1; padding: 20px;">Sé el primero en comentar! 👆</p>';
                    return;
                }
                
                comentarios.forEach(c => {
                    lista.innerHTML += `
                        <div class="comentario-item">
                            <strong>${c.name}</strong>
                            <p>${c.message}</p>
                            <small>${new Date(c.created_at).toLocaleDateString('es-MX')}</small>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error cargando comentarios:', error);
                document.getElementById('listaComentarios').innerHTML = 
                    '<p style="color: #ff6b6b; padding: 20px;">Cargando comentarios...</p>';
            }
        }

        document.getElementById('formComentario').addEventListener('submit', async e => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const mensaje = document.getElementById('mensaje').value.trim();
            
            if (!nombre || !mensaje) return;
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: nombre, message: mensaje })
                });
                
                alert('¡Comentario enviado y publicado! ✅');
                e.target.reset();
                cargarComentarios();
            } catch (error) {
                alert('Error al enviar, intenta de nuevo');
            }
        });

        cargarComentarios();
    </script>
</body>
</html>
