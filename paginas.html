<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrhorkosWebSites | Portafolio de Proyectos</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* # AQUÍ CONFIGURO LAS VARIABLES DE DISEÑO PARA MANTENER LA MISMA ESTÉTICA OSCURA Y MODERNA */
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
            --primary: #7b2ffd;
            --primary-hover: #9353ff;
            --accent: #00f5d4;
            --text-main: #f8f9fa;
            --text-muted: #a0a5b1;
            --border-color: #2a2c3d;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* # RESETEO GENERAL DE MÁRGENES Y TIPOGRAFÍA PARA TODO EL DOCUMENTO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* # CREO LA BARRA DE NAVEGACIÓN SUPERIOR CON LOS BOTONES DE ACCESO RÁPIDO */
        .top-nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-regresar, .btn-catalogo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-regresar:hover, .btn-catalogo:hover {
            border-color: var(--primary);
            background: #252530;
        }

        /* # DEFINO EL CONTENEDOR PRINCIPAL DONDE ALOJARÉ TODO EL CONTENIDO DEL PORTAFOLIO */
        section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px 60px 20px;
        }

        /* # DISEÑO EL ENCABEZADO PRINCIPAL DE LA PÁGINA */
        .header-portafolio {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-portafolio h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .header-portafolio p {
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* # ESTILIZO LAS SECCIONES DE CATEGORÍAS */
        .category-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* # CONSTRUYO LA ESTRUCTURA VISUAL PARA CADA PROYECTO Y SUS 5 IMÁGENES */
        .project-card {
            background: #141414;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            transition: var(--transition);
        }

        .project-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(123, 47, 253, 0.2);
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .project-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* # ESTILO PARA LAS 5 IMÁGENES O CAPTURAS DEL SITIO */
        .project-img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #22222a;
        }

        .project-link-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .project-link {
            color: var(--accent);
            text-decoration: none;
            transition: var(--transition);
        }

        .project-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- # AQUÍ COLOCO MI BARRA SUPERIOR PARA REGRESAR AL INICIO O IR AL CATÁLOGO DE PRECIOS -->
    <div class="top-nav">
        <a href="index.html" class="btn-regresar"><i class="fa-solid fa-arrow-left"></i> Volver al Inicio</a>
        <a href="sitios.html" class="btn-catalogo"><i class="fa-solid fa-store"></i> Ver Catálogo y Precios</a>
    </div>

    <!-- # AQUÍ ESTABLEZCO EL ENCABEZADO CON EL TEXTO SOLICITADO SOBRE MIS SITIOS WEB -->
    <section>
        <div class="header-portafolio">
            <h1>Portafolio de Trabajos</h1>
            <p>Sitios Web — todos creados por mí</p>
        </div>

        <!-- # SECCIÓN 1: EJEMPLOS DE SITIOS WEB BÁSICOS -->
        <div class="category-section">
            <h2 class="category-title"><i class="fa-solid fa-laptop-code"></i> Ejemplos de sitios web básicos</h2>

            <!-- 
            # AQUÍ INICIO EL BLOQUE DE UN PROYECTO BÁSICO: 
            # Yo copio y pego este bloque completo cada vez que quiera agregar un nuevo sitio web básico al portafolio.
            
            <div class="project-card">
                <div class="project-title">Nombre del Proyecto Básico 1</div>
                <div class="project-images-grid">
                    <img src="ruta/imagen1.jpg" alt="Captura 1" class="project-img">
                    <img src="ruta/imagen2.jpg" alt="Captura 2" class="project-img">
                    <img src="ruta/imagen3.jpg" alt="Captura 3" class="project-img">
                    <img src="ruta/imagen4.jpg" alt="Captura 4" class="project-img">
                    <img src="ruta/imagen5.jpg" alt="Captura 5" class="project-img">
                </div>
                <div class="project-link-container">
                    <span>URL del sitio:</span>
                    <a href="https://enlace-del-sitio.com" target="_blank" class="project-link">https://enlace-del-sitio.com</a>
                </div>
            </div>
            <!-- 
            # AQUÍ TERMINA EL BLOQUE DEL PROYECTO BÁSICO QUE DEBO COPIAR Y PEGAR PARA AÑADIR MÁS.
            -->

        </div>

        <!-- # SECCIÓN 2: EJEMPLOS DE SITIOS WEB ESTÁNDAR -->
        <div class="category-section">
            <h2 class="category-title"><i class="fa-solid fa-server"></i> Ejemplos de sitios web estándar</h2>

            <!-- 
            # AQUÍ INICIO EL BLOQUE DE UN PROYECTO ESTÁNDAR: 
            # AQUI selecciono, copio y pego este bloque completo abajo cada vez que quiera registrar un nuevo sitio web estándar.
            -->
            <div class="project-card">
                <div class="project-title">Sitio web de Boxer y Calcetines </div>
                <div class="project-images-grid">
                    <img src="SITIO_CALCETINES_Y_BOXER/SITIO_CALCETINES_Y_BOXER_1.png" alt="Captura 1" class="project-img">
                    <img src="SITIO_CALCETINES_Y_BOXER/SITIO_CALCETINES_Y_BOXER_2.png" alt="Captura 2" class="project-img">
                </div>
                <div class="project-link-container">
                    <span>URL del sitio:</span>
                    <a href="https://krhorkos3dstudioand2d.github.io/KrhorkosStore/index.html" target="_blank" class="project-link">https://krhorkos3dstudioand2d.github.io/KrhorkosStore/index.html</a>
                </div>
            </div>
            <!-- 
            # AQUÍ TERMINA EL BLOQUE DEL PROYECTO ESTÁNDAR QUE DEBO COPIAR Y PEGAR PARA CREAR MÁS ENTRADAS.
            -->

        </div>
    </section>

</body>
</html>
